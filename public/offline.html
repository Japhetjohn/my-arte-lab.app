<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're offline - MyArteLab</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #111827;
      --subtext: #6B7280;
      --accent: #9747FF;
      --accent-hover: #8534f0;
      --card-border: #DADDE1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #F9FAFB;
        --subtext: #9CA3AF;
        --accent: #9747FF;
        --accent-hover: #8534f0;
        --card-border: #2F3032;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-col;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: rgba(151, 71, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--accent);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      color: var(--subtext);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      background-color: var(--accent);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .brand-note {
      margin-top: 32px;
      font-size: 12px;
      color: var(--subtext);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Please check your internet connection and try again to continue using MyArteLab.</p>
    <button class="btn" onclick="window.location.reload()">Try again</button>
    <div class="brand-note">Built for African creators</div>
  </div>
</body>
</html>
