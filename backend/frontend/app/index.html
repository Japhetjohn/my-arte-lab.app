<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyArteLab - Creator Marketplace</title>
    <meta name="description" content="Discover and book top African creators. Built for African creators, trusted by clients globally.">

    <!-- Web App Manifest & PWA Configuration -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#9747FF">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Apple Web App Meta & Touch Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MyArteLab">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://app.myartelab.com">
    <meta property="og:title" content="MyArteLab - Creator Marketplace">
    <meta property="og:description" content="Discover and book top African creators. Built for African creators, trusted by clients globally.">
    <meta property="og:image" content="https://app.myartelab.com/images/myartelab-logo.png">
    <meta property="og:site_name" content="MyArteLab">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MyArteLab - Creator Marketplace">
    <meta name="twitter:description" content="Discover and book top African creators. Built for African creators, trusted by clients globally.">
    <meta name="twitter:image" content="https://app.myartelab.com/images/myartelab-logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

    <!-- Early capture of PWA beforeinstallprompt event so it is never missed by SPAs -->
    <script>
      (function() {
        window.__MYARTELAB_PWA_PROMPT__ = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__MYARTELAB_PWA_PROMPT__ = e;
          window.dispatchEvent(new CustomEvent('myartelab:beforeinstallprompt'));
        });
        window.addEventListener('appinstalled', function() {
          window.__MYARTELAB_PWA_PROMPT__ = null;
          try {
            localStorage.setItem('myartelab_pwa_installed', 'true');
          } catch(e) {}
          window.dispatchEvent(new CustomEvent('myartelab:appinstalled'));
        });
      })();
    </script>

    <!-- Clean Light Theme Initialization Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('myartelab_theme');
          // MyArteLab default is clean light theme. Only apply dark if explicitly set to 'dark' by user in Settings.
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
