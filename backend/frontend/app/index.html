    <!-- Structured Data: Organization & ProfessionalService for Visual Creatives -->

          "@id": "https://app.myartelab.com/#website",
          "url": "https://app.myartelab.com",

    <!-- Early capture of PWA beforeinstallprompt event so it is never missed by SPAs -->
    <script>
      (function() {
        window.__MYARTELAB_PWA_PROMPT__ = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__MYARTELAB_PWA_PROMPT__ = e;
          window.dispatchEvent(new CustomEvent('myartelab:beforeinstallprompt'));
        });
        window.addEventListener('appinstalled', function() {
          window.__MYARTELAB_PWA_PROMPT__ = null;
          try {
            localStorage.setItem('myartelab_pwa_installed', 'true');
          } catch(e) {}
          window.dispatchEvent(new CustomEvent('myartelab:appinstalled'));
        });
      })();
    </script>

    <!-- Clean Light Theme Initialization Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('myartelab_theme');
          // MyArteLab default is clean light theme. Only apply dark if explicitly set to 'dark' by user in Settings.
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Immediate Inline Styles for Initial Loader (Prevents FOUC, layout shifts, and flickering) -->
    <style id="initial-loader-css">
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fafafa;
        z-index: 99999;
      }
      .dark #initial-loader {
        background-color: #121212;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        border: 2px solid #9747FF;
        border-top-color: transparent;
        animation: initial-spin 0.8s linear infinite;
        box-sizing: border-box;
      }
      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

  <body>
    <div id="root">
      <div id="initial-loader" aria-hidden="true">
        <div class="initial-spinner" role="status" aria-label="Loading"></div>
